<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Earnings</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Earnings">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{box-sizing:border-box;--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#1f5fd1;--ok:#1b7f46;--bad:#c0392b;--ln:#e2e5ee;--hi:#eaf1fd;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#e8ebf3;--mu:#98a0b3;--ac:#6ea0ff;--ok:#55c486;--bad:#ff7b6b;--ln:#2b3242;--hi:#202a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#e8ebf3;--mu:#98a0b3;--ac:#6ea0ff;--ok:#55c486;--bad:#ff7b6b;--ln:#2b3242;--hi:#202a40;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}h2{font-size:15px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.rate{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:9px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;text-align:center}
.row{display:grid;grid-template-columns:1.2fr auto 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:flex;align-items:center;gap:6px}.st b{min-width:22px;text-align:center;font-size:17px}.st button{width:34px;height:34px;padding:0;font-size:18px}
.today{background:var(--hi);border-radius:8px}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.b{font-weight:700;font-size:17px;border-top:1px solid var(--ln);margin-top:4px;padding-top:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lab{font-size:12px;color:var(--mu);margin-bottom:2px}
.item{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--ln)}
.item .full{grid-column:1/-1}.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--hi)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:5px 4px;border-bottom:1px solid var(--ln);text-align:right}.tbl th{color:var(--mu);font-weight:500}.tbl td:first-child,.tbl th:first-child{text-align:left}
details summary{cursor:pointer;font-weight:600}.sec>summary{display:flex;justify-content:space-between;gap:8px;font-weight:700;padding:2px 0}.sec[open]>summary{margin-bottom:8px}.itm{border-bottom:1px solid var(--ln)}.itm summary{display:flex;justify-content:space-between;gap:8px;padding:10px 0;font-weight:500}.itm .item{border:0;padding-top:0}
</style></head><body><main>
<h1>💵 Class Earnings <span class="mu">· Mon–Fri only</span></h1>
<div class="card rate"><div><div class="mu">1 USD =</div><div class="big" id="rate"></div><div class="mu" id="rst"></div></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="p" id="rf">Refresh rate</button><button id="sv" hidden>Save a copy</button></div></div>
<details class="card"><summary>Settings</summary><div class="g2" style="margin-top:8px" id="set"></div></details>
<div class="tabs" id="tabs"></div><div id="view"></div>
<p class="mu">Rate is a mid-market estimate; your bank’s rate may differ a little. Data is saved on this device.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const PK=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const T=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const fd=(d,o)=>d.toLocaleDateString('en-GB',o||{day:'numeric',month:'short'});
const US=n=>'$'+n.toFixed(2),ZA=n=>(n<0?'−R':'R')+Math.abs(n).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\u00a0/g,' ');
const wd=d=>d.getDay()%6!==0, mon=d=>add(d,-((d.getDay()+6)%7));
const DEF={pay:3.5,fee:100,tithe:10,payFee:5,taxLimit:99000,carry:{},est:{},tithePaid:{},otherM:{},taxRate:18,taxBase:0,perWeek:19,estWeeks:4,plan:{biz:[],bday:[],sav:[],other:[],bill:[]},payday:5,startDay:1,backup:16.5,lastRate:0,classes:{},locked:{},inHand:0,perWeek:19,estWeeks:4,items:[]};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('ceApp')||'{}'))}catch(e){S=Object.assign({},DEF)}
let loading=true,syncTimer=null;
const save=()=>{if(!loading)S.ts=Date.now();try{localStorage.setItem('ceApp',JSON.stringify(S))}catch(e){}sched()};
if(!S.v2){S.perWeek=19;S.v2=1}
S.plan=Object.assign({biz:[],bday:[],sav:[],other:[],bill:[]},S.plan);let live=0,tab='week',wk=mon(T),mo=null;
const cur=()=>live||S.lastRate||S.backup;
function pS(d){const s=+S.startDay;let m=d.getMonth();if(d.getDate()<s)m--;return new Date(d.getFullYear(),m,s)}
function pE(st){return add(new Date(st.getFullYear(),st.getMonth()+1,st.getDate()),-1)}
function pD(st){const e=add(pE(st),1),p=+S.payday;return e.getDate()<=p?new Date(e.getFullYear(),e.getMonth(),p):new Date(e.getFullYear(),e.getMonth()+1,p)}
const rOf=st=>+S.locked[K(st)]||cur();
const lg=d=>{const v=S.classes[K(d)];return v===undefined||v===''?null:+v};
function cnt(a,b,proj){let n=0;for(let d=a;d<=b;d=add(d,1)){if(!wd(d))continue;const v=lg(d);if(v!==null)n+=v;else if(proj&&d>T)n+=S.perWeek/5}return n}
function rand(a,b){let r=0;for(let d=a;d<=b;d=add(d,1)){if(wd(d))r+=(lg(d)||0)*S.pay*rOf(pS(d))}return r}
const net=(n,r)=>n>0?Math.max(n*S.pay*r*(1-S.tithe/100)-S.fee,0):0;
function paydays(){const o=[];for(let st=pS(add(T,-70));o.length<12;st=pS(add(pE(st),1))){const p=pD(st);if(p>=T)o.push({st,p,n:cnt(st,pE(st),true)})}
let c=+S.inHand;o.forEach(x=>{x.r=rOf(x.st);x.net=net(x.n,x.r);c+=x.net;x.cum=c});return o}
function head(){$('#rate').textContent='R'+cur().toFixed(4);
$('#rst').innerHTML=live?'<span class="ok">● LIVE</span> just now':(S.lastRate?'Saved rate (live not available here)':'Backup rate (live not available here)')}
async function getRate(){$('#rf').textContent='…';try{const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();if(j&&j.rates&&j.rates.ZAR){live=+j.rates.ZAR;S.lastRate=live;save()}}catch(e){}
$('#rf').textContent='Refresh rate';head();draw()}
function setUI(){const f=[['pay','Pay per class ($)'],['fee','Conversion fee, once a month (R)'],['payFee','Payment fee, once a month (R)'],['tithe','Tithe (% of pay before the fee)'],['taxLimit','Tax starts above (R per tax year)'],['taxRate','Tax rate (%)'],['taxBase','Income already earned this tax year (R)'],['perWeek','Classes I expect per week (for estimates)'],['estWeeks','Weeks per month for estimates'],['payday','Payday (day of month)'],['startDay','Pay month starts on day'],['backup','Backup rate (R per $)']];
$('#set').innerHTML=f.map(([k,l])=>`<div><div class="lab">${l}</div><input type="number" step="any" data-s="${k}" value="${S[k]}"></div>`).join('')+ghUI()+bkUI()+'<div class="mu" style="grid-column:1/-1">Start day 1 = pay months are calendar months (October classes are paid on the 5th of November). Use 5 only if your pay month runs 5th to 4th.</div>'}
function tabsUI(){$('#tabs').innerHTML=[['week','Week'],['month','Month'],['plan','Plan'],['tax','Tax']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}
function weekV(){const days=[0,1,2,3,4].map(i=>add(wk,i));let n=0,usd=0,zr=0;const parts={};
const rows=days.map(d=>{const v=lg(d)||0,st=pS(d),r=rOf(st);n+=v;usd+=v*S.pay;zr+=v*S.pay*r;const q=parts[K(st)]=parts[K(st)]||{st,n:0};q.n+=v;
return`<div class="row ${+d===+T?'today':''}"><div><b>${fd(d,{weekday:'short'})}</b> <span class="mu">${fd(d)}</span></div><div class="st"><button data-c="${K(d)}" data-d="-1">−</button><b>${v}</b><button data-c="${K(d)}" data-d="1">+</button></div><div class="num">${US(v*S.pay)}</div><div class="num">${ZA(v*S.pay*r)}</div></div>`}).join('');
const P=Object.values(parts);
return`<div class="card"><div class="nav"><button data-w="-7">‹</button><div>${fd(wk)} – ${fd(add(wk,4))} ${wk.getFullYear()}<div class="mu">Sat &amp; Sun off${+wk===+mon(T)?' · this week':''}</div></div><button data-w="7">›</button></div>${rows}
<div class="tot b"><span>Week total · ${n} class${n===1?'':'es'}</span><span>${US(usd)} → ${ZA(zr)}</span></div></div><div class="card"><details><summary>Add a batch of past classes</summary><div class="g2" style="margin-top:8px"><div><div class="lab">From</div><input type="date" id="bf"></div><div><div class="lab">To</div><input type="date" id="bt"></div><div><div class="lab">Total classes</div><input type="number" id="bn"></div><div style="align-self:end"><button class="p" data-batch>Spread over Mon–Fri</button></div></div><div class="mu" style="margin-top:6px">Spreads the total evenly over weekdays. Totals are exact; fix single days with + and −.</div></details></div>`+
(P.length>1?`<div class="card"><b>Split at the new pay month</b><div class="mu">This week crosses a pay-month start, so each part has its own rate.</div>${P.map(q=>`<div class="tot"><span>From ${fd(q.st)} · ${q.n} classes @ R${rOf(q.st).toFixed(4)}</span><span>${ZA(q.n*S.pay*rOf(q.st))}</span></div>`).join('')}</div>`:'')}
function monthV(){const st=mo||pS(T),en=pE(st),r=rOf(st),pd=pD(st);const segs=[];
for(let a=st;a<=en;){const b=new Date(Math.min(+en,+add(mon(a),6)));if(cnt(a,b)||[0,1,2,3,4].some(i=>{const d=add(a,i);return d<=b&&wd(d)}))segs.push([a,b]);a=add(b,1)}
const{n,zr,fee,ti,tp,tx,pl,ot,keep,fut,carry}=nums(st),lk=+S.locked[K(st)];
const rows=segs.map(([a,b],i)=>{const c=cnt(a,b);return`<div class="tot"><span>Week ${i+1} · ${fd(a)} – ${fd(b)}</span><span>${c} · ${US(c*S.pay)} · ${ZA(rand(a,b))}</span></div>`}).join('');
return`<div class="card"><div class="nav"><button data-m="-1">‹</button><div>Pay month ${fd(st)} – ${fd(en,{day:'numeric',month:'short',year:'numeric'})}<div class="mu">Paid ${fd(pd,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div></div><button data-m="1">›</button></div>${rows}
<div class="tot b"><span>${n.toFixed(fut?1:0)} classes${fut?' (estimate)':''}</span><span>${US(n*S.pay)}</span></div>
<div class="tot"><span>Rate ${lk?'<span class="pill">locked</span>':'<span class="pill">estimate</span>'}</span><span>R${r.toFixed(4)}</span></div>
<div class="tot"><span>In rand</span><span>${ZA(zr)}</span></div>${ot>0?`<div class="tot"><span>Other income</span><span>+${ZA(ot)}</span></div>`:''}<div class="tot"><span>Fees (${ZA(num(S.fee))} conversion + ${ZA(num(S.payFee))} payment)</span><span>−${ZA(fee)}</span></div>
<div class="tot"><span>${tp!==null?'Tithe (what you paid)':`Tithe (${S.tithe}% of ${ZA(zr+ot)})`}</span><span>−${ZA(ti)}</span></div>${tx>0?`<div class="tot"><span>Tax (${S.taxRate}% above ${ZA(+S.taxLimit)})</span><span>−${ZA(tx)}</span></div>`:''}<div class="tot b"><span>You keep</span><span class="ok">${ZA(keep)}</span></div><div class="tot"><span>Left over from last month</span><span>${carry>0?'+':''}${ZA(carry)}</span></div><div class="tot"><span>Planned to buy / save</span><span>−${ZA(pl)}</span></div><div class="tot b"><span>Left after planned</span><span class="${keep+carry-pl<0?'bad':'ok'}">${ZA(keep+carry-pl)}</span></div>${maybeOf(st)>0?`<div class="mu">Not counted: ${ZA(maybeOf(st))} maybe. If it comes, left would be <b>${ZA(keep+carry-pl+maybeOf(st)*(1-S.tithe/100))}</b> (after tithe).</div>`:''}</div>
${fut?`<div class="card"><div class="lab">Estimated classes this month – type to change (empty = ${S.perWeek} a week × ${S.estWeeks||4} weeks)</div><input type="number" step="any" data-est="${K(st)}" value="${estOf(st)===null?'':estOf(st)}" placeholder="${(num(S.perWeek)*num(S.estWeeks||4)).toFixed(1)}"></div>`:''}${fut?'':`<div class="card"><b>What really happened this month</b><div class="g2" style="margin-top:8px"><div><div class="lab">Rand I received (after the ${ZA(num(S.fee))} conversion fee)</div><input type="number" step="any" data-rcv="${K(st)}" value="${lk?(n*S.pay*lk-num(S.fee)).toFixed(2):''}" placeholder="e.g. 2973"></div><div><div class="lab">Other money received (Dad etc.)</div><input type="number" step="any" data-om="${K(st)}" value="${(S.otherM||{})[K(st)]||''}" placeholder="e.g. 500"></div><div><div class="lab">Tithe I paid</div><input type="number" step="any" data-tp="${K(st)}" value="${tp===null?'':tp}" placeholder="${((zr+ot)*S.tithe/100).toFixed(2)}"></div></div><div class="mu" style="margin-top:6px">Empty boxes use the estimates above.</div></div>`}<div class="card"><div class="lab">Rate I got on payday (type it to lock this month)</div><input type="number" step="any" data-lock="${K(st)}" value="${lk||''}" placeholder="e.g. 16.62"></div>`}
function planV(){const pdz=paydays();const it=S.items.map((x,i)=>{const p=+x.price||0;let h='';
if(x.bought)h='<span class="pill">Bought</span>';else{const early=p<=+S.inHand?'now':(pdz.find(z=>z.cum>=p)||{}).p;let l='';
if(x.date){const D=PK(x.date);let m=+S.inHand;pdz.forEach(z=>{if(z.p<=D)m+=z.net});const sp=S.items.reduce((s,y)=>s+(!y.bought&&y.date&&y.date<=x.date?+y.price||0:0),0);const left=m-sp;
l=left>=0?`<span class="ok"><b>OK</b> – ${ZA(left)} left after buying</span>`:`<span class="bad"><b>Short by ${ZA(-left)}</b> on ${fd(D)}</span>`}
h=l+`<div class="mu">Earliest payday you can afford it: ${early==='now'?'now':early?fd(early,{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'beyond 12 paydays'} · ${(p/cur()/S.pay).toFixed(1)} classes</div>`}
return`<div class="item"><input class="full" data-i="${i}" data-k="name" value="${(x.name||'').replace(/"/g,'&quot;')}" placeholder="What do you want to buy?"><div><div class="lab">Price (R)</div><input type="number" step="any" data-i="${i}" data-k="price" value="${x.price||''}"></div><div><div class="lab">Buy on</div><input type="date" data-i="${i}" data-k="date" value="${x.date||''}"></div><div class="full">${h}</div><label class="mu"><input type="checkbox" style="width:auto" data-i="${i}" data-k="bought" ${x.bought?'checked':''}> Bought</label><button data-del="${i}" style="justify-self:end">Remove</button></div>`}).join('');
return`<div class="card"><div class="g2"><div><div class="lab">Money in hand today (R)</div><input type="number" step="any" data-s="inHand" value="${S.inHand}"></div><div><div class="lab">Classes I expect per week (planning)</div><input type="number" step="any" data-s="perWeek" value="${S.perWeek}"></div></div></div>
<div class="card"><b>What I want to buy</b>${it||'<div class="mu" style="padding:8px 0">Nothing yet. Add something, pick the day you want to buy it, and see if the money will be there.</div>'}<button class="p" data-add style="margin-top:10px">+ Add item</button></div>
<div class="card"><details><summary>Money coming in</summary><table class="tbl"><tr><th>Payday</th><th>Classes</th><th>After fee &amp; tithe</th><th>Total</th></tr>${pdz.map(z=>`<tr><td>${fd(z.p)}</td><td>${z.n.toFixed(1)}</td><td>${ZA(z.net)}</td><td>${ZA(z.cum)}</td></tr>`).join('')}</table><div class="mu" style="margin-top:6px">Past days use your logged classes. Future weekdays with nothing logged use your expected classes per week ÷ 5, at the rate shown for that pay month.</div></details></div>`}
const num=x=>+x||0,esc=v=>String(v||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function taxYr(d){const y=d.getMonth()>=2?d.getFullYear():d.getFullYear()-1;return[new Date(y,2,1),add(new Date(y+1,2,1),-1)]}
function taxTable(ref,proj){const[ts,te]=taxYr(ref),th=num(S.taxLimit),rt=num(S.taxRate)/100;let cum=num(S.taxBase);const rows=[];
for(let st=pS(add(ts,-45));;st=pS(add(pE(st),1))){const p=pD(st);if(p>te)break;if(p<ts)continue;const g=cp(st,proj)*S.pay*rOf(st)+otherOf(st),ov=Math.max(0,cum+g-th)-Math.max(0,cum-th);cum+=g;rows.push({st,p,g,cum,tax:ov*rt})}return rows}
const taxOf=(st,pj)=>{const r=taxTable(pD(st),!!pj).find(x=>+x.st===+st);return r?r.tax:0};
function bdMonths(b){const D=PK(b.date);let c=0;for(let st=pS(T),i=0;i<60;i++,st=pS(add(pE(st),1))){const p=pD(st);if(p>D)break;if(p>=T)c++}return Math.max(1,c)}
const bdAmt=b=>b.save!==undefined&&b.save!==''?num(b.save):b.date?Math.max(0,num(b.budget)-num(b.have))/bdMonths(b):0;
function amtForOld(g,x,st){if(g==='bill')return st<pS(T)||(x.until&&st>PK(x.until))?0:num(x.amount);const k=K(st),cs=pS(T),curK=K(cs);if(x.doneK===k&&k===curK)return 0;{const f=x.amts&&x.amts[k];if(f!==undefined&&f!==''&&num(f)>=0)return st<cs?0:Math.max(0,num(f))}let per,rem,step;
if(g==='biz'){rem=Math.max(0,num(x.price)-num(x.paid));const u=x.until?moTo(x.until):0;step=num(x.perMonth)>0?num(x.perMonth):u?rem/u:rem;per=Math.min(step,rem)}
else if(g==='bday'){rem=Math.max(0,num(x.budget)-num(x.have));step=bdAmt(x);per=Math.min(step,rem)}
else{rem=num(x.goal)>0?Math.max(0,num(x.goal)-num(x.paid)):1e12;const u=x.until&&x.goal?moTo(x.until):0;step=num(x.amount)>0?num(x.amount):u?rem/u:0;per=Math.min(step,rem)}
if(on(x,k))return per;if(!x.auto||!(per>0)||st<cs)return 0;
let j=0;for(let a=cs;a<st&&j<80;j++)a=pS(add(pE(a),1));if(x.doneK===curK&&j>0)j--;
const dl=g==='bday'?x.date:x.until;if(dl&&pD(st)>PK(dl))return 0;
return Math.max(0,Math.min(per,rem-j*step))}
const moTo=d=>bdMonths({date:d});
function amtFor(g,x,st){if(g==='bill')return(x.until&&st>PK(x.until))||st<pS(T)?0:num(x.amount);const f=x.amts&&x.amts[K(st)];return f===undefined||f===''?0:Math.max(0,num(f))}
const schedTotal=x=>Object.values(x.amts||{}).reduce((t,v)=>t+num(v),0);
function migrate(){if(S.v3)return;const c0=pS(T);['biz','bday','sav'].forEach(g=>S.plan[g].forEach(x=>{x.amts=x.amts||{};let a=pS(add(c0,-1));for(let i=0;i<14;i++){const v=amtForOld(g,x,a);if(v>0&&(x.amts[K(a)]===undefined||x.amts[K(a)]===''))x.amts[K(a)]=String(Math.round(v*100)/100);a=pS(add(pE(a),1))}x.months=[];x.month='';x.auto=false}));S.v3=1;save()}

else if(D.quick){{const cu=mo||pS(T);S.plan.other.push({name:'Dad',date:T>=cu&&T<=pE(cu)?K(T):K(cu),amount:D.quick,maybe:!!D.maybe})};save();draw()}
else if(D.padd){S.plan[D.padd].push(D.padd==='biz'?{name:'',price:'',month:'',open:true}:D.padd==='bday'?{name:'',date:'',budget:'',have:'',month:'',open:true}:D.padd==='bill'?{name:'',amount:'',day:'',until:'',open:true}:D.padd==='other'?{name:'',date:(()=>{const cu=mo||pS(T);return T>=cu&&T<=pE(cu)?K(T):K(cu)})(),amount:'',open:true}:{name:'',amount:'',month:'',open:true});save();draw()}});

if(D.s){S[D.s]=+t.value;save();head();draw()}else if(D.lock){if(t.value)S.locked[D.lock]=+t.value;else delete S.locked[D.lock];save();draw()}
else if(D.rcv){if(t.value==='')delete S.locked[D.rcv];else{const a0=PK(D.rcv),nn=cnt(a0,pE(a0));if(nn>0)S.locked[D.rcv]=((+t.value+num(S.fee))/(nn*S.pay)).toFixed(6)}save();draw()}

else if(D.tp){if(t.value==='')delete S.tithePaid[D.tp];else S.tithePaid[D.tp]=t.value;save();draw()}else if(D.est){if(t.value==='')delete S.est[D.est];else S.est[D.est]=t.value;save();draw()}else if(D.grid){const[g,i,m]=D.grid.split('.'),x=S.plan[g][+i];x.amts=x.amts||{};if(t.value==='')delete x.amts[m];else x.amts[m]=t.value;save();draw()}else if(D.carry){if(t.value==='')delete S.carry[D.carry];else S.carry[D.carry]=t.value;save();draw()}else if(D.g){const x=S.plan[D.g][+D.i];if(D.k==='amt'){const kk=K(mo||pS(T));x.amts=x.amts||{};if(t.value==='')delete x.amts[kk];else x.amts[kk]=t.value}else if(D.k==='month'){const kk=K(mo||pS(T));x.months=(x.months||[]).filter(m=>m!==kk);if(x.month===kk)x.month='';if(t.checked)x.months.push(kk)}else x[D.k]=t.type==='checkbox'?t.checked:t.value;save();draw()}});

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.dataset.bk)return;const ta=document.querySelector('#bk');
if(b.dataset.bk==='show'){const o=JSON.parse(JSON.stringify(S));delete o.gh;ta.value=JSON.stringify(o);ta.focus();ta.select()}
else{try{const d=JSON.parse(ta.value);if(!d||typeof d!=='object'||!d.plan)throw 0;const gh=S.gh;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,DEF,d);if(gh)S.gh=gh;S.plan=Object.assign({biz:[],bday:[],sav:[],other:[],bill:[]},S.plan);save();setUI();head();draw();ta.value='Imported ✓'}catch(x){ta.value='That does not look like the data. Paste the text you copied.'}}});

/* ---------- GitHub sync (data lives in your repo) ---------- */
S.gh=Object.assign({owner:'',repo:'earnings',path:'earnings-data.json',branch:'main'},S.gh);
const tokGet=()=>{try{return localStorage.getItem('ceTok')||''}catch(e){return ''}};
let remoteSha=null,ghMsg=GH_IDLE();
function GH_IDLE(){return tokGet()?'Ready':'Not connected'}
const setSync=m=>{ghMsg=m;const e=document.querySelector('#ghs');if(e)e.textContent=m};
function ghUI(){const g=S.gh,ip=(k,l,t)=>`<div><div class="lab">${l}</div><input type="${t||'text'}" data-gh="${k}" value="${esc(g[k])}" autocapitalize="off" autocomplete="off"></div>`;
return `<div style="grid-column:1/-1"><b>GitHub sync</b><div class="mu">Your data is saved to a file in your own repo, so it follows you to any device. The token stays on this device only.</div></div>${ip('owner','GitHub username')}${ip('repo','Repository')}${ip('path','Data file')}${ip('branch','Branch')}<div style="grid-column:1/-1"><div class="lab">Access token (needs Contents: read &amp; write on that repo)</div><input type="password" data-tok="1" value="${esc(tokGet())}" autocomplete="off"></div><div style="grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap"><button class="p" data-ghpush="1">Save to GitHub now</button><button data-ghpull="1">Load from GitHub</button></div><div class="mu" style="grid-column:1/-1" id="ghs">${ghMsg}</div>`}
const b64=t=>btoa(unescape(encodeURIComponent(t))),unb64=t=>decodeURIComponent(escape(atob(t.replace(/\n/g,''))));
const ghReady=()=>tokGet()&&S.gh.owner&&S.gh.repo&&S.gh.path;
const ghApi=(m,body)=>{const g=S.gh;return fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path}`+(m==='GET'?`?ref=${encodeURIComponent(g.branch)}`:''),{method:m,headers:{Authorization:'Bearer '+tokGet(),Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined})};
const snap=()=>{const o=JSON.parse(JSON.stringify(S));delete o.gh;return o};
async function pull(force){if(!ghReady()){loading=false;return}setSync('Checking GitHub…');
try{const r=await ghApi('GET');if(r.status===404){remoteSha=null;setSync('No data file yet - it is created on your first save');loading=false;return}
if(!r.ok)throw new Error(r.status===401?'bad token':r.status===403?'no access':'error '+r.status);
const j=await r.json();remoteSha=j.sha;const d=JSON.parse(unb64(j.content));
if(force||(d.ts||0)>(S.ts||0)){const gh=S.gh;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,DEF,d,{gh});S.plan=Object.assign({biz:[],bday:[],sav:[],other:[],bill:[]},S.plan);try{localStorage.setItem('ceApp',JSON.stringify(S))}catch(e){}setUI();head();draw();setSync('Loaded from GitHub')}
else setSync('Up to date with GitHub')}catch(e){setSync('GitHub: '+e.message)}loading=false}
async function push(retry){if(!ghReady())return;setSync('Saving to GitHub…');
try{const r=await ghApi('PUT',{message:'Update earnings data',content:b64(JSON.stringify(snap(),null,1)),branch:S.gh.branch,sha:remoteSha||undefined});
if(r.status===409||r.status===422){if(!retry){await pull(false);return push(true)}throw new Error('changed on another device - load first')}
if(!r.ok)throw new Error(r.status===401?'bad token':r.status===403||r.status===404?'no access to repo':'error '+r.status);
const j=await r.json();remoteSha=j.content.sha;setSync('Saved to GitHub '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))}catch(e){setSync('GitHub: '+e.message)}}
function sched(){if(loading||!ghReady())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>push(),2500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!loading)pull(false)});
document.addEventListener('change',e=>{const t=e.target,D=t.dataset;if(D.gh){S.gh[D.gh]=t.value.trim();try{localStorage.setItem('ceApp',JSON.stringify(S))}catch(x){}}else if(D.tok){try{localStorage.setItem('ceTok',t.value.trim())}catch(x){}setSync(t.value.trim()?'Ready':'Not connected')}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ghpush)push();else if(b.dataset.ghpull)pull(true)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setUI();head();draw();getRate();pull(false);
</script></body></html>
